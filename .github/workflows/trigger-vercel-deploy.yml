name: Trigger Portfolio Rebuild

on:
  push:
    branches:
      - main
    # run when content files change; adjust to your repo layout if needed
    paths:
      - 'content/**'
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set. Aborting."
            exit 1
          fi
          echo "Calling Vercel Deploy Hook..."
          # POST an empty JSON body to the Vercel deploy hook URL stored in repo secret
          curl -sS -X POST "$HOOK_URL" -H "Content-Type: application/json" -d '{}' || { echo "Deploy hook failed"; exit 1; }
          echo "Deploy hook called."